<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilates Workspace | 普拉提学习工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">🧘‍♀️ Pilates Workspace</div>
    <nav class="nav-links">
      <button class="nav-btn active" onclick="switchTab('dashboard')">仪表盘</button>
      <button class="nav-btn" onclick="switchTab('library')">动作库</button>
      <button class="nav-btn" onclick="switchTab('logs')">训练记录</button>
    </nav>
  </header>

  <main class="container">
    <section id="dashboard" class="tab-content active">
      <h2>👋 欢迎回来，开始今天的普拉提练习！</h2>
      
      <div class="stats-grid">
        <div class="stat-card">
          <h3>今日任务完成度</h3>
          <p class="stat-num" id="today-progress">0/0</p>
        </div>
        <div class="stat-card">
          <h3>累计训练次数</h3>
          <p class="stat-num" id="total-logs-count">0 次</p>
        </div>
      </div>

      <div class="card">
        <h3>📋 今日普拉提练习清单</h3>
        <ul class="task-list" id="task-list">
          </ul>
      </div>

      <div class="card">
        <h3>📚 推荐学习资料</h3>
        <div class="links-grid">
          <a href="https://www.youtube.com" target="_blank" class="resource-link">🎬 YouTube 普拉提教程</a>
          <a href="https://www.bilibili.com" target="_blank" class="resource-link">📺 B站精选动作讲解</a>
          <a href="#" class="resource-link">📄 解剖学与核心控制笔记</a>
        </div>
      </div>
    </section>

    <section id="library" class="tab-content">
      <h2>📖 普拉提经典动作库</h2>
      <div class="grid-list" id="library-list">
        </div>
    </section>

    <section id="logs" class="tab-content">
      <h2>✍️ 记录今天的训练</h2>
      <div class="card">
        <form id="log-form" onsubmit="addLog(event)">
          <div class="form-group">
            <label for="log-date">日期：</label>
            <input type="date" id="log-date" required>
          </div>
          <div class="form-group">
            <label for="log-duration">时长（分钟）：</label>
            <input type="number" id="log-duration" min="1" placeholder="例如：45" required>
          </div>
          <div class="form-group">
            <label for="log-note">训练心得 / 练习动作：</label>
            <textarea id="log-note" rows="3" placeholder="记录今天练习的感受，如：核心稳定性提升..." required></textarea>
          </div>
          <button type="submit" class="primary-btn">提交记录</button>
        </form>
      </div>

      <h3>📅 历史训练日志</h3>
      <div class="log-history" id="log-history">
        </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
